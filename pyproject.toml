[project]
name = "paperlm"
version = "0.1.0"
description = "Parallel PDF-to-TEI extraction pipeline for PaperLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.2.0",
    "lxml>=6.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
